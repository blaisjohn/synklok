name: Synklok
options:
  bundleIdPrefix: app.synklok
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "2"
    DEAD_CODE_STRIPPING: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_CFBundleDisplayName: Synklok
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
    INFOPLIST_KEY_NSHumanReadableCopyright: ""
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Synklok talks to your RME M-1620 over the local network (or the USB control link) to monitor and sync the sample rate."
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Synklok:
    type: application
    platform: macOS
    sources:
      - path: Synklok
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.synklok
        PRODUCT_NAME: Synklok
        CODE_SIGN_ENTITLEMENTS: Synklok/Synklok.entitlements
        INFOPLIST_FILE: Synklok/Info.plist
        CODE_SIGN_STYLE: Automatic
